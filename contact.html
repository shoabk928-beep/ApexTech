      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>

  <div class="page-header">
    <h1>Get In Touch</h1>
    <p>We'd love to hear from you. Send us a message!</p>
  </div>

  <section class="container">
    <div class="contact-container">
      <!-- Contact Info -->
      <div>
        <h2>Contact Details</h2>
        <p style="margin: 15px 0;"><strong>Address:</strong>islamabad</p>
        <p style="margin: 15px 0;"><strong>Email:</strong> shuaib.muhammad.eng@gmail.com</p>
        <p style="margin: 15px 0;"><strong>Phone:</strong> +92-3499081602</p>
      </div>

      <!-- Contact Form -->
      <div>
        <form onsubmit="event.preventDefault(); alert('Message sent successfully!');">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" required placeholder="Enter your full name">
          </div>
          <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" required placeholder="Enter your email address">
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" required placeholder="Write your message here..."></textarea>
          </div>
          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>
    </div>
  </section>
